<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MR. RUBEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e3343a;--red2:#8e1c22;--amber:#f2b45a;--paper:#eadfc6;--ink:#0d0e12;--bg:#07080b;
  --panel:#101219;--panel2:#161923;--line:#2a2f3c;--txt:#d9dce4;--dim:#878ea0;--green:#7cf0a4;
  --blue:#6fb3ff;--yellow:#f4d35e;--cork:#3a2a1c;
  --f-pix:'Press Start 2P',monospace;--f-mono:'IBM Plex Mono','Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;font-family:var(--f-mono);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
input{font:inherit;user-select:text;-webkit-user-select:text}
/* холст кадра чуть больше экрана (кадр делится на целые пиксели), поэтому он внутри обрезающей рамки:
   иначе страница на iOS становится шире экрана, браузер её отдаляет и касания начинают тормозить кадры */
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;background:#000}
/* весь интерфейс — в одном слое, увеличенном на --ui (настройка «Размер интерфейса»): внутри он раскладывается
   в «виртуальном» экране размером экран/--ui, поэтому вместо vw/vh внутри используются cqw/cqh этого слоя */
#ui{position:fixed;left:0;top:0;width:calc(100% / var(--ui,1));height:calc(100% / var(--ui,1));transform:scale(var(--ui,1));transform-origin:0 0;container-type:size;z-index:10}
#crt{position:fixed;inset:0;pointer-events:none;z-index:70;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);}
#crt::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
#crt::before{content:'';position:absolute;inset:0;background:rgba(255,240,220,.025);animation:flick 4s infinite steps(1)}
@keyframes flick{0%,100%{opacity:.6}47%{opacity:1}48%{opacity:.3}50%{opacity:.9}}
body.nocrt #crt{display:none}
body.dbgnoui #hud,body.dbgnoui #prompt,body.dbgnoui #thought,body.dbgnoui #toasts,body.dbgnoui #fade,body.dbgnoui #crt,body.dbgnoui #sub,body.dbgnoui #layer{display:none!important}
body.dbgnoui #joy{visibility:hidden}
body.touch #crt::before{animation:none;display:none}
.hidden{display:none!important}
@keyframes blink{50%{opacity:0}}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .35s}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none;z-index:20}
#hud .info{background:linear-gradient(90deg,rgba(7,8,11,.88),rgba(7,8,11,.55) 70%,rgba(7,8,11,0));padding:8px 28px 9px 10px;border-left:3px solid var(--red);max-width:58cqw}
#hud .ep{font-family:var(--f-pix);font-size:9px;color:var(--red);letter-spacing:1px;line-height:1.5}
#hud .when{font-family:var(--f-pix);font-size:8px;color:var(--dim);margin-top:5px}
#hud .goal{font-size:13px;margin-top:7px;color:var(--txt);line-height:1.35}
#hud .goal::before{content:'▸ ';color:var(--amber)}
#hud .btns{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.hbtn{width:44px;height:44px;background:rgba(13,14,18,.88);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.hbtn canvas{width:24px;height:24px;image-rendering:pixelated}
.hbtn:hover{border-color:var(--red)}
.hbtn .dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;background:var(--red);border-radius:50%;box-shadow:0 0 6px var(--red)}
.hbtn .k{position:absolute;bottom:1px;right:3px;font-size:9px;color:var(--dim);font-family:var(--f-mono)}
body.touch .hbtn .k{display:none}

/* ---------- prompt & thought ---------- */
#prompt{position:fixed;z-index:24;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#prompt .lbl{font-size:12px;color:#f3ead7;text-shadow:0 1px 0 #000,0 0 6px #000,0 0 2px #000;white-space:nowrap}
#prompt .key{min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#0d0e12;border:2px solid #f3ead7;color:#f3ead7;font-family:var(--f-pix);font-size:8px;display:grid;place-items:center}
#thought{position:fixed;z-index:26;transform:translate(-50%,-100%);max-width:min(360px,72cqw);font-style:italic;font-size:14px;line-height:1.4;color:#efe8d8;
  background:rgba(10,10,14,.78);padding:7px 12px 9px;border:1px dashed rgba(239,232,216,.35);pointer-events:none;transition:opacity .35s;text-align:center;opacity:0}
#thought.on{opacity:1}
#thought::before{content:'— мысли —';display:block;font-style:normal;font-family:var(--f-pix);font-size:7px;color:var(--amber);margin-bottom:5px;letter-spacing:1px}

/* ---------- dialogue ---------- */
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(880px,calc(100cqw - 24px));
  background:rgba(9,10,14,.95);border:1px solid var(--line);border-top:3px solid var(--red);display:flex;gap:14px;padding:14px 16px 16px;z-index:30;animation:pop .2s}
#dlg .portrait{width:104px;height:104px;flex:none;image-rendering:pixelated;background:#0b0c10;border:1px solid var(--line)}
#dlg .main{flex:1;min-width:0;position:relative}
#dlg .name{font-family:var(--f-pix);font-size:10px;color:var(--red);margin-bottom:9px;letter-spacing:1px}
#dlg .text{font-size:16px;line-height:1.5;min-height:3em}
#dlg .choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.choice{background:#151821;border:1px solid var(--line);text-align:left;padding:9px 11px;font-size:14px;cursor:pointer;line-height:1.35}
.choice:hover,.choice.sel{border-color:var(--red);background:#1d202b}
.choice.seen{color:var(--dim)}
#dlg .next{position:absolute;right:0;bottom:-6px;font-size:12px;color:var(--dim);animation:blink 1s steps(2) infinite}
#dlg.narr{border-top-color:var(--amber)} #dlg.narr .name{color:var(--amber)}
#dlg.narr .text{font-style:italic}

/* ---------- generic overlay/panel ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,5,8,.84);display:flex;align-items:center;justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));animation:pop .18s}
.panel{width:min(1040px,100%);height:min(700px,100%);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);display:flex;flex-direction:column;min-height:0}
.panel.small{width:min(560px,100%);height:auto;max-height:100%}
.panel header{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel h2{font-family:var(--f-pix);font-size:12px;margin:0;flex:1;letter-spacing:1px;line-height:1.5}
.xbtn{background:none;border:1px solid var(--line);width:36px;height:36px;cursor:pointer;font-size:16px}
.xbtn:hover{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{background:none;border:1px solid transparent;border-bottom:none;padding:9px 12px;cursor:pointer;font-family:var(--f-pix);font-size:8px;color:var(--dim);white-space:nowrap}
.tab.on{color:var(--txt);border-color:var(--line);background:var(--panel2)}
.panel .body{flex:1;overflow:auto;padding:14px;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.muted{color:var(--dim)}
.btn{background:#1a1d27;border:1px solid var(--line);padding:10px 14px;cursor:pointer;font-family:var(--f-pix);font-size:9px;letter-spacing:1px}
.btn:hover,.btn:focus{border-color:var(--red);outline:none}
.btn.red{background:var(--red2);border-color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* inventory */
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--panel2);border:1px solid var(--line);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.item:hover,.item.on{border-color:var(--amber)}
.item canvas{width:64px;height:64px;image-rendering:pixelated}
.item b{font-size:13px}
.idesc{margin-top:14px;padding:12px;border:1px dashed var(--line);font-size:14px;line-height:1.5;min-height:60px}
.sect{font-family:var(--f-pix);font-size:9px;color:var(--amber);margin:16px 0 10px;letter-spacing:1px}
.sect:first-child{margin-top:0}

/* suspects */
.suslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.scard{background:#e8dcc0;color:#1b1610;padding:7px 7px 9px;cursor:pointer;position:relative;box-shadow:2px 3px 0 rgba(0,0,0,.5);transform:rotate(var(--r,0deg))}
.scard canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;background:#1a1c22;display:block}
.scard .nm{font-family:var(--f-pix);font-size:8px;margin-top:7px;text-align:center}
.scard .st{font-size:10px;text-align:center;margin-top:4px}
.scard.locked{filter:grayscale(1) brightness(.4);cursor:default}
.scard:hover:not(.locked){outline:2px solid var(--red)}
.sdetail{display:grid;grid-template-columns:180px 1fr;gap:16px}
.sdetail canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;background:#1a1c22;border:6px solid #e8dcc0}
.kv{margin-bottom:12px;font-size:14px;line-height:1.5}
.kv>b{display:block;font-family:var(--f-pix);font-size:8px;color:var(--dim);margin-bottom:5px;letter-spacing:1px}
.status{display:inline-block;padding:3px 8px;font-family:var(--f-pix);font-size:8px;border:1px solid;margin:2px 4px 2px 0;line-height:1.6}
.s-confirmed{color:#7be39a;border-color:#2f7b49}.s-contradiction{color:#f4d35e;border-color:#8a7322}
.s-refuted{color:#ff6b6b;border-color:#8e1c22}.s-unknown{color:#aab;border-color:#555b6b}.s-varya{color:#7ab8ff;border-color:#2c5a8e}
.evmini{padding:7px 9px;border-left:2px solid var(--amber);background:#141720;margin:6px 0;font-size:13px;line-height:1.4}
.evmini .t{color:var(--amber);font-size:11px;font-family:var(--f-pix);margin-right:6px}

/* investigation */
.cork{background:#3a2a1c radial-gradient(circle at 20% 30%,rgba(255,255,255,.04),transparent 40%),repeating-radial-gradient(circle at 0 0,rgba(0,0,0,.08) 0 2px,transparent 2px 5px);}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.evc{background:var(--paper);color:#1d1810;padding:12px 12px 12px;position:relative;box-shadow:2px 3px 0 rgba(0,0,0,.45);transform:rotate(var(--r,0deg));font-size:13px;line-height:1.45}
.evc::before{content:'';position:absolute;top:-5px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:inset -2px -2px 0 rgba(0,0,0,.3);transform:translateX(-50%)}
.evc h4{margin:2px 0 6px;font-family:var(--f-pix);font-size:8px;line-height:1.6}
.evc .who{font-size:11px;color:#6b5b45;margin-bottom:4px}
.evc .time{position:absolute;right:8px;top:8px;font-size:11px;background:#1d1810;color:var(--paper);padding:1px 5px}
.evc.new{outline:2px solid var(--red)}
.evc{animation:evIn .45s ease-out both;animation-delay:var(--d,0ms)}
@keyframes evIn{from{opacity:0;transform:translateY(10px) rotate(var(--r,0deg))}to{opacity:1;transform:rotate(var(--r,0deg))}}
.evsearch{width:100%;margin:0 0 12px;background:#14161d;border:1px solid var(--line);color:inherit;padding:8px 10px;font:inherit;font-size:14px}
/* Дело */
.case{display:flex;flex-direction:column;gap:10px;flex:1}.case .carea{flex:1}.ccard .clm{font-size:11px;color:#2c5a8e;font-style:italic;margin-bottom:2px}
.casebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.casebar .sp{flex:1}
.casehelp{font-size:12px;color:#d8c8a8;opacity:.75}
.caseq{background:rgba(10,10,14,.55);padding:8px 12px;border-left:3px solid var(--amber)}
.caseq:empty{display:none}.caseq .sect{margin:6px 0 6px}
.qq{font-size:14px;line-height:1.45;margin:4px 0;animation:evIn .4s ease-out both}.qq .m{display:inline-block;width:18px;color:var(--amber);font-weight:bold}
.qq.res{opacity:.6}.qq.res .m{color:#7be39a}.qq small{color:#9aa}
.hyp{font-size:13px;margin:5px 0;line-height:1.5}.hyp small{color:#8a90a0}
.cst{display:inline-block;font-family:var(--f-pix);font-size:7px;padding:2px 6px;border:1px solid;margin-right:8px;vertical-align:1px;letter-spacing:.5px}
.carea{position:relative}
.clines{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;position:relative}
.ccard{background:var(--paper);color:#1d1810;padding:8px 9px 9px;position:relative;box-shadow:2px 3px 0 rgba(0,0,0,.45);transform:rotate(var(--r,0deg));font-size:12px;line-height:1.35;cursor:grab;user-select:none;-webkit-user-select:none;animation:evIn .4s ease-out both;animation-delay:var(--d,0ms);min-height:78px}
.ccard .top{display:flex;gap:6px;align-items:center;font-size:10px;color:#6b5b45;margin-bottom:4px}
.ccard .top .tm{background:#1d1810;color:var(--paper);padding:0 4px}.ccard .top .tm.cl{background:#2c5a8e;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .grip{margin-left:auto;font-size:15px;line-height:1;padding:2px 4px;cursor:grab;touch-action:none;color:#6b5b45}
.ccard b{display:block;font-size:13px;margin-bottom:3px}
.ccard .s{font-size:11px;color:#6b5b45}
.ccard .ln{position:absolute;right:6px;bottom:4px;font-size:10px;color:#8e1c22}
.ccard.stmt{background:#dfe6ee}.ccard.stmt b::before{content:'❝ ';color:#2c5a8e}
.ccard.unseen::after{content:'';position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.ccard.new{outline:2px solid var(--red);animation:evNew .7s ease-out both}
@keyframes evNew{0%{opacity:0;transform:translateY(-30px) scale(1.15) rotate(-4deg)}70%{opacity:1;transform:translateY(2px) scale(.98)}100%{transform:rotate(var(--r,0deg))}}
.ccard.over{outline:3px dashed var(--amber);transform:scale(1.04)}
.ccard.pick{outline:3px solid var(--amber)}
.ccard.lift{opacity:.35}
.ccard.ghost{position:fixed;z-index:10000;pointer-events:none;opacity:.92;box-shadow:6px 10px 0 rgba(0,0,0,.4);animation:none}
.ccard.flash{animation:cflash .9s ease-out}
@keyframes cflash{0%{box-shadow:0 0 0 0 var(--fc)}30%{box-shadow:0 0 0 6px var(--fc)}100%{box-shadow:2px 3px 0 rgba(0,0,0,.45)}}
.cban{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;background:#0d0f14;border:1px solid;padding:8px 14px;font-family:var(--f-pix);font-size:9px;letter-spacing:1px;animation:cban 1.9s ease both;white-space:nowrap}
@keyframes cban{0%{opacity:0;transform:translate(-50%,-6px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.cthink{position:sticky;bottom:-14px;display:flex;gap:10px;align-items:center;background:#0d0f14;border-top:1px solid var(--line);padding:8px 10px;margin:4px -14px -14px;z-index:4}
.cthink canvas{width:40px;height:40px;image-rendering:pixelated;flex:none}
.cthink .tx{font-size:14px;line-height:1.45;font-style:italic;color:#e8e2d0;min-height:2.9em;display:flex;align-items:center}
.cthink .tx .ln{animation:evIn .35s ease-out both}
.cthink.contra{border-top-color:#ff6b6b}.cthink.sup{border-top-color:#7be39a}.cthink.con{border-top-color:#f4d35e}
.cdet{background:#12141b;border:1px solid var(--line);padding:12px 14px;animation:evIn .25s ease-out both}
.cdet.hidden{display:none}
.cdet .dh{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-pix);font-size:8px;color:var(--dim)}
.cdet h3{margin:6px 0 4px;font-size:16px}.cdet .meta{font-size:12px;color:var(--amber);margin-bottom:8px}
.cdet .claim{font-size:13px;color:#9ac8ff;margin-bottom:6px}.cdet p{margin:0 0 10px;font-size:14px;line-height:1.5}
.cdet .dl{font-size:13px;margin:4px 0}.cdet .dl .x{background:none;border:0;color:var(--dim);cursor:pointer;margin-left:6px}
.tle.conf{border-color:#8e1c22;box-shadow:inset 3px 0 0 #ff6b6b}.tle.conf .tt{color:#ff6b6b}.tle.unk{opacity:.6;font-style:italic}
.cslist{display:flex;flex-direction:column;gap:8px}
.csrow{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;background:#12141b;border:1px solid var(--line);padding:8px;cursor:pointer}
.csrow:hover{border-color:var(--red)}.csrow canvas{width:48px;height:48px;image-rendering:pixelated}
.csrow .nm{font-family:var(--f-pix);font-size:9px;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.csrow .nm .cst{margin:0}
.csrow .cl{font-size:13px;line-height:1.4}.csrow .red{color:#ff8a8a}.csrow .q{color:var(--amber)}.csrow .dim{color:var(--dim);font-size:12px}
.evfly{position:fixed;left:50%;top:40%;z-index:9999;pointer-events:none;width:min(320px,78vw);background:#efe6cc;color:#1d1810;padding:12px 16px 14px;box-shadow:0 0 0 2px #8e1c22,6px 8px 0 rgba(0,0,0,.5);transform:translate(-50%,-50%) scale(.85);opacity:0;transition:transform .3s ease-out,opacity .3s;font-family:'IBM Plex Mono',monospace}
.evfly.in{opacity:1;transform:translate(-50%,-50%)}
.evfly.out{transition:transform .5s cubic-bezier(.6,0,.8,.4),opacity .5s;opacity:.15}
.evfly .k{font-family:var(--f-pix);font-size:9px;color:#8e1c22;letter-spacing:1px;margin-bottom:6px}
.evfly .no{font-size:11px;color:#6b5b45}.evfly b{display:block;font-size:16px;margin:2px 0 4px}.evfly .s{font-size:12px;color:#6b5b45}
.hbtn.pulse{animation:hpulse .6s ease-out}
@keyframes hpulse{0%{transform:scale(1)}40%{transform:scale(1.25);box-shadow:0 0 0 4px rgba(227,52,58,.5)}100%{transform:scale(1)}}
.evfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#1a1d27;border:1px solid var(--line);padding:5px 9px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--amber);color:var(--amber)}
.tl{position:relative;padding-left:76px}
.tl::before{content:'';position:absolute;left:62px;top:0;bottom:0;width:2px;background:var(--red2)}
.tle{position:relative;margin:0 0 12px;background:#141720;border:1px solid var(--line);padding:8px 10px;font-size:13px;line-height:1.45}
.tle .tt{position:absolute;left:-76px;top:7px;width:56px;text-align:right;font-family:var(--f-pix);font-size:9px;color:var(--amber)}
.tle::before{content:'';position:absolute;left:-19px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.tle .src{font-size:11px;color:var(--dim)}
.tle.unk{opacity:.45}
#linkcv{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.nbtable{width:100%;border-collapse:collapse;font-size:13px}

<script>
/* ---- 10_core ---- */
'use strict';
/* =====================================================================
   MR. RUBEN — подарочная детективная игра.
   Структура файла:
   10 core    — утилиты, состояния (Episode/Character/Evidence/Inventory/
                Time/Dialogue/Puzzle/Save), ввод, звук
   20 art     — процедурный пиксель-арт: шрифт, персонажи, предметы
   30 data    — персонажи, улики, предметы, диалоги, столы, компьютеры, эпизоды
   40 world   — локации, карты, движение, взаимодействия, освещение
   50 ui      — HUD, диалоги, мысли, панели, стол, компьютер, телефон, мини-игры
   60 scenes  — катсцены, переходы эпизодов, финал
   70 main    — главное меню, игровой цикл
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wait = ms => new Promise(r => setTimeout(r, ms));
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } },
};
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
if (IS_TOUCH) document.body.classList.add('touch');
const tmin = s => { if (!s) return 9999; const [a, b] = s.split(':').map(Number); return (a < 6 ? a + 24 : a) * 60 + b; };

/* ---------------- Settings ---------------- */
const Settings = {
  music: 0.55, sfx: 0.8, crt: true, textSpeed: 2, gfx: 'auto', debug: false, zoom: 1, ui: 1,
  load() { let o = {}; try { o = JSON.parse(store.get('mrruben_settings') || '{}'); } catch (e) { } Object.assign(this, o); if (!(o.v >= 2) && IS_TOUCH) this.crt = false; /* на телефонах сканлайны по умолчанию выключены: полноэкранный слой дорого композитить */ this.apply(); },
  save() { store.set('mrruben_settings', JSON.stringify({ v: 2, music: this.music, sfx: this.sfx, crt: this.crt, textSpeed: this.textSpeed, gfx: this.gfx, debug: this.debug, zoom: this.zoom, ui: this.ui })); this.apply(); },
  apply() { document.body.classList.toggle('nocrt', !this.crt); if (typeof SND !== 'undefined') SND.applyVol(); Scale.apply(); },
};
/* ---------------- Масштаб ----------------
   Картинка: размер героя на экране постоянен в «физических» пикселях, а не в доле высоты экрана —
   на iPad видно больше мира, а не тот же кусок крупнее; на iPhone — крупнее, чем раньше.
   Интерфейс: --ui = настройка «Размер интерфейса», с поправкой, если браузер отдалил страницу. */
const Scale = {
  z: 1,
  // во сколько раз браузер уменьшил страницу (iPad в режиме «полная версия сайта» показывает её отдалённой)
  page() { const land = innerWidth > innerHeight, sw = screen.width || innerWidth, sh = screen.height || innerHeight; const dw = land ? Math.max(sw, sh) : Math.min(sw, sh); return clamp(dw / innerWidth, 0.3, 1); },
  ui() { return clamp((Settings.ui || 1) / this.page(), 0.5, 3); },
  apply() { const z = this.ui(); if (z === this.z && document.documentElement.style.getPropertyValue('--ui')) return; this.z = z; document.documentElement.style.setProperty('--ui', String(z));
    if (typeof World !== 'undefined' && World.L && G.mode !== 'menu') resize(true); if (typeof Desk !== 'undefined') Desk.layout(); if (typeof Menu !== 'undefined' && G.mode === 'menu') Menu.resize(); },
  // css-пикселей экрана на пиксель мира
  world(L, cw, ch) {
    const tH = L ? (L.viewH || 170) : 170, minW = L ? (L.minW || 230) : 230, port = ch > cw;
    const fill = Math.min(ch / tH, cw / (minW * (port ? 0.7 : 1)));            // локация во всю высоту (или ширину в портрете)
    const short = Math.min(cw, ch) * this.page();                              // короткая сторона в настоящих css-пикселях устройства
    const f = 400 / short;                                                    // большой экран — больше мира, маленький — крупнее
    let s = fill * (L && L.type === 'top' ? clamp(Math.pow(f, 0.5), 0.6, 1.3) : clamp(f, 0.4, 1.4)); // офис на больших экранах отдаляем мягче
    if (L && L.fit) s = Math.min(cw / L.w, ch / L.H); // финал в гараже: вся комната целиком на любом экране
    else if (L && L.type === 'side') s = L.fill ? ch / L.H : Math.min(Math.max(s, ch / (L.H * (port ? 3 : 2))), ch / L.H); // комнаты — во всю высоту экрана
    return Math.max(0.25, s * clamp(Settings.zoom || 1, 0.4, 2.5));
  },
};

/* ---------------- Game state ----------------
   Всё, что сохраняется, лежит в одном объекте G.s.
   Менеджеры ниже — единственные точки изменения. */
const G = { s: null, paused: false, mode: 'menu' };
function freshState() {
  return {
    v: 3,
    episode: 1, maxEpisode: 1,
    phase: 'day',            // TimeState: 'day' | 'night'
    clock: '07:10',          // отображаемое время
    loc: 'apt', px: 150, py: 0, dir: 'right',
    flags: {},               // сюжетные флаги
    inv: [], easter: [],     // InventoryState
    suspects: {},            // CharacterState: id -> {added, talked:{}}
    evidence: [], evNew: [], // EvidenceState
    comps: {},               // PuzzleState: компьютеры, открытые файлы
    puzzles: {},             // решённые мини-игры
    seen: {},                // DialogueState: просмотренные реплики/выборы
    deskSeen: {},            // осмотренные предметы на столах
    phoneNew: [],            // непрочитанные чаты
    world: {},               // состояние мира: открытые двери, свет, взятые вещи
    links: [], qs: {}, insp: {}, // Дело: сделанные связки, открытые вопросы, осмотренные карточки
    luxUntil: 0,
  };
}

const Flags = {
  has: f => !!G.s.flags[f],
  set(f, v = true) { if (G.s.flags[f] === v) return; G.s.flags[f] = v; if (/_alibi$/.test(f)) Case.sync(); Game.onChange(); },
  all: (...fs) => fs.every(f => G.s.flags[f]),
};

const Ev = { // EvidenceState
  has: id => G.s.evidence.includes(id),
  add(id, quiet) {
    if (!EVIDENCE[id]) { console.warn('no evidence', id); return false; }
    if (Ev.has(id)) return false;
    G.s.evidence.push(id); G.s.evNew.push(id);
    const e = EVIDENCE[id];
    if (e.who && CHARS[e.who] && !Sus.has(e.who) && e.who !== 'varya' && e.who !== 'ruben') Sus.add(e.who, true);
    if (!quiet) { Case.arrive(id); SND.sfx('evidence'); if (e.who === 'varya' || e.status === 'varya') setTimeout(() => SND.motif('varya'), 400); UI.markBtn('inv2', true); }
    Game.onChange();
    return true;
  },
  of: who => G.s.evidence.filter(id => EVIDENCE[id].who === who),
  count: ids => ids.filter(Ev.has).length,
};

const Inv = { // InventoryState
  has: id => G.s.inv.includes(id) || G.s.easter.includes(id),
  add(id, quiet) {
    const it = ITEMS[id]; if (!it || Inv.has(id)) return false;
    (it.kind === 'easter' ? G.s.easter : G.s.inv).push(id);
    if (!quiet) { UI.toast(it.kind === 'easter' ? 'ПАСХАЛКА' : 'ПРЕДМЕТ', it.name); SND.sfx(it.kind === 'easter' ? 'easter' : 'pickup'); UI.markBtn('inv', true); }
    Game.onChange(); return true;
  },
};

const Sus = { // CharacterState
  has: id => !!(G.s.suspects[id] && G.s.suspects[id].added),
  add(id, quiet) {
    if (Sus.has(id)) return;
    G.s.suspects[id] = Object.assign(G.s.suspects[id] || {}, { added: true });
    Flags.set(id + '_added');
    if (!quiet) { UI.toast('ПАПКА ПОДОЗРЕВАЕМЫХ', CHARS[id].name + ' добавлен(а) в дело'); SND.sfx('paper'); UI.markBtn('sus', true); }
    Game.onChange();
  },
  // Статус вычисляется по найденным уликам — не «виновен/невиновен».
  statuses(id) {
    const set = new Set();
    for (const eid of Ev.of(id)) { const st = EVIDENCE[eid].status; if (st) set.add(st); }
    if (!set.size) set.add('unknown');
    return ['refuted', 'contradiction', 'confirmed', 'varya', 'unknown'].filter(s => set.has(s));
  },
};
const STATUS = {
  confirmed: ['ПОДТВЕРЖДЕНО', '🟢', 'Информация совпадает с независимым источником.'],
  contradiction: ['ЕСТЬ ПРОТИВОРЕЧИЕ', '🟡', 'Часть рассказа не совпадает с найденными данными.'],
  refuted: ['АЛИБИ ОПРОВЕРГНУТО', '🔴', 'Есть объективное доказательство, что человек был в другом месте.'],
  unknown: ['НЕИЗВЕСТНО', '❓', 'Пока недостаточно информации.'],
  varya: ['СВЯЗАНО С ВАРЕЙ', '🔵', 'Найдена связь с Варей, но значение пока неизвестно.'],
};

const Puzzle = { // PuzzleState
  solved: id => !!G.s.puzzles[id],
  solve(id) { if (G.s.puzzles[id]) return; G.s.puzzles[id] = true; Game.onChange(); },
  compOpen: id => !!(G.s.comps[id] && G.s.comps[id].unlocked),
  unlockComp(id) { G.s.comps[id] = Object.assign(G.s.comps[id] || {}, { unlocked: true }); Flags.set(id + '_computer_unlocked'); },
};

const Time = { // TimeState
  isNight: () => G.s.phase === 'night',
  set(phase, clock) { G.s.phase = phase; if (clock) G.s.clock = clock; Game.onChange(); },
  date: () => (EPISODES[G.s.episode] || {}).date || '',
};

const Save = {
  KEY: 'mrruben_save_v3',
  exists: () => !!store.get(Save.KEY),
  write() {
    if (!G.s || G.mode === 'menu' || G.noSave) return;
    if (World.player) { G.s.px = Math.round(World.player.x); G.s.py = Math.round(World.player.y); G.s.dir = World.player.dir; }
    if (World.locId && !World.locId.startsWith('__') && World.locId !== 'garage') G.s.loc = World.locId;
    store.set(Save.KEY, JSON.stringify(G.s));
    const m = Math.max(G.s.maxEpisode, +(store.get('mrruben_maxep') || 1));
    store.set('mrruben_maxep', String(m));
  },
  read() { try { const s = JSON.parse(store.get(Save.KEY)); if (s && s.v === 3) { const o = Object.assign(freshState(), s); if (o.inv.includes('bracelet')) { o.inv = o.inv.filter(x => x !== 'bracelet'); if (!o.easter.includes('bracelet')) o.easter.push('bracelet'); } return o; } } catch (e) { } return null; }, // браслет «RUBEN» теперь в пасхалках — старые сохранения переносим
  maxEpisode: () => Math.max(1, +(store.get('mrruben_maxep') || 1)),
  wipe() { store.del(Save.KEY); store.del('mrruben_maxep'); },
};

/* ---------------- Input ---------------- */
const Input = {
  keys: {}, pressed: new Set(), joy: { x: 0, y: 0, active: false, id: null, ox: 0, oy: 0 }, act: false,
  init() {
    addEventListener('keydown', e => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (!this.keys[e.code]) this.pressed.add(e.code);
      this.keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
      UI.onKey(e);
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });
    addEventListener('blur', () => { this.keys = {}; });
    const zone = $('#joyZone'), joy = $('#joy'), knob = $('#joy .knob');
    const R = 52;
    // Джойстик на неблокирующих событиях: прокрутку запрещает CSS (touch-action:none), а не preventDefault,
    // поэтому браузер не ждёт наш обработчик на каждом движении пальца и не душит отрисовку кадров.
    // Внешний вид джойстика обновляется раз в кадр (Input.paint), а не на каждое событие.
    const start = (id, x, y) => { this.joy = { active: true, id, ox: x, oy: y, x: 0, y: 0, dx: 0, dy: 0, moved: true, shown: false }; Dbg.touch(true); };
    const move = (x, y) => {
      let dx = x - this.joy.ox, dy = y - this.joy.oy; const d = Math.hypot(dx, dy);
      const r = R * Scale.z; if (d > r) { dx = dx / d * r; dy = dy / d * r; }
      this.joy.x = dx / r; this.joy.y = dy / r; this.joy.dx = dx; this.joy.dy = dy; this.joy.moved = true; Dbg.move();
    };
    const end = () => { if (!this.joy.active) return; this.joy.active = false; this.joy.x = this.joy.y = 0; this.joy.moved = true; Dbg.touch(false); };
    this.paint = () => { const j = this.joy; if (!j.moved) return; j.moved = false;
      if (j.active) { if (!j.shown) { j.shown = true; joy.style.left = j.ox / Scale.z + 'px'; joy.style.top = j.oy / Scale.z + 'px'; joy.style.opacity = 1; } knob.style.transform = `translate(calc(-50% + ${j.dx / Scale.z | 0}px),calc(-50% + ${j.dy / Scale.z | 0}px))`; }
      else { joy.style.opacity = 0; } };
    if (window.PointerEvent) {
      // Движение и отпускание пальца слушаем на всём окне, без захвата указателя: они доходят всегда,
      // даже если палец ушёл за пределы зоны. Новое первое касание (isPrimary) всегда перезапускает
      // джойстик — «залипшее» старое касание больше не блокирует управление.
      zone.addEventListener('pointerdown', e => { if (this.joy.active && !e.isPrimary) return; start(e.pointerId, e.clientX, e.clientY); SND.init(); }, { passive: true });

function interrogation(id, cfg) {
  const A = id + '_alibi';
  return () => [
    { s: id, t: G.s.seen['met_' + id] ? cfg.again : cfg.hello },
    { do: () => { G.s.seen['met_' + id] = 1; } },
    { label: 'q' },
    { ch: [
      { t: (GREET[id] || 'Привет.') + ' Где ты был вчера вечером?', go: 'alibi' },
      ...cfg.q.map((x, i) => ({ t: x[0], go: 'q' + i, if: x[2] === 'after' ? () => Flags.has(A) : null })),
      { t: 'Ладно, пока всё.', go: 'end' },
    ] },
    { label: 'alibi' }, { s: 'ruben', t: (GREET[id] || 'Привет.') + ' Где ты был вчера вечером?' }, ...cfg.alibi.map(t => ({ s: id, t })), { alibi: id }, { go: 'q' },
    ...cfg.q.flatMap((x, i) => [{ label: 'q' + i }, { s: 'ruben', t: x[0] }, ...[].concat(x[1]).map(t => ({ s: id, t })), { go: 'q' }]),
    { label: 'end' }, { s: id, t: cfg.bye },
  ];
}

function talkScript(id) {
  if (id === 'mark' && G.s.episode === 1 && !Flags.has('mark_interrogated') && !Case.made('varya_errands|varya_left')) return [{ s: 'ruben', t: '(Секунду. Сначала соберу в голове, что я уже знаю. «Дело» — кнопка «Расследование».)' }];
  if (id === 'mark') return MARK_DAY();
  if (!Flags.has('mark_interrogated')) return [{ s: id, t: BEFORE_MARK[id] || '…' }];
  if (G.s.episode === 1 && !(Ev.has('cam_enter') && Ev.has('cam_bag'))) return [{ s: id, t: 'Марк сказал, у него запись с камер. Посмотри её сначала — потом поговорим.' }, { s: 'ruben', t: '(Сначала — запись с камер у Марка.)' }];
  return DAY_TALK[id] ? DAY_TALK[id]() : [{ s: id, t: '…' }];
}

const aptReady = () => Promise.all(Object.values(APT_IMG).map(im => im.decode ? im.decode().catch(() => { }) : Promise.resolve()));
function drawAptImg(c, night) { const im = APT_IMG[night ? 'night' : 'day']; if (im.complete && im.naturalWidth) c.drawImage(im, 0, 0); else drawApt(c, APT_W, APT_H, night); }
// координаты предметов комнаты (днём и ночью картинки чуть сдвинуты)
const aptPt = () => ({ tv: [27, 52, 33, 19], phone: [148, 107], mon: [55, 94] });
function drawApt(c, W, H, night) {
  const F = 92;
  R(c, 0, 0, W, 8, '#14161c');
  wallpaper(c, 0, 8, W, F - 8, night ? '#24343a' : '#2e444a', 3);

  // rx,ry — экранная позиция левого верхнего угла полосы окна (мировой x=0), rw — ширина полосы, rh — высота

/* ---------- мерцание источников света ---------- */
function flickK(l, t) {
  const s = l.x * 0.131 + l.y * 0.077;
  switch (l.fl) {
    case 'fluo': { const v = Math.sin(t * 0.9 + s) * Math.sin(t * 0.37 + s * 1.7); return v > 0.9 ? (Math.sin(t * 47 + s) > 0 ? 0.3 : 1) : 0.97 + Math.sin(t * 50 + s) * 0.03; }
    case 'dying': { const v = Math.sin(t * 13 + s) > 0.82 || Math.sin(t * 3.1 + s * 0.3) > 0.95; return v ? 0.15 : 0.92 + Math.sin(t * 37) * 0.06; }
    case 'tv': return 0.62 + 0.25 * Math.sin(t * 7.3 + s) * Math.sin(t * 2.1) + 0.13 * Math.sin(t * 23);
    case 'neon': return Math.sin(t * 0.7 + s) > 0.96 ? (Math.sin(t * 60) > 0 ? 0.2 : 1) : 1;
    case 'warm': return 0.96 + Math.sin(t * 3 + s) * 0.03;
    case 'pulse': return 0.55 + 0.45 * Math.max(0, Math.sin(t * 2.2 + s));
  }
  return 1;
}

/* ---------- зеркальный пол ---------- */
const Mirror = {
  // маска пола: где плитка блестит (белое = отражает)
  buildMask(W) {
    const L = W.L; const [mc, m] = mk(L.mw, L.mh);
    if (L.mirrorMask) L.mirrorMask(m);
    else {
      const tiles = L.mirror.tiles || '.'; m.fillStyle = '#fff';
      L.map.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (tiles.includes(row[i])) m.fillRect(i * 16, j * 16, 16, 16); });
    }
    m.globalCompositeOperation = 'destination-out'; m.fillStyle = '#000';
    for (const w of (L.walls || [])) m.fillRect(w[0], w[1], w[2], w[3]);
    m.globalCompositeOperation = 'source-over';
    return mc;
  },
  // отражение спрайта: перевёрнутое, с затуханием сверху вниз
  _rc: new WeakMap(),
  refl(img, fadeLen) {
    let e = this._rc.get(img); const key = fadeLen | 0; if (e && e.k === key) return e.c;

const Game = {

  async goto(loc, x, y, dir, opts = {}) {

    if (!opts.instant) { SND.sfx(opts.sound || 'door'); await UI.fade(true, 350); }
    World.enter(loc, x, y, dir);
    if (!opts.instant) await UI.fade(false, 350);
    G.transit = false;
    if (LOC[loc] && !opts.quiet) { const n = LOC[loc].name; if (n && n !== this._lastName) UI.toast('', n); this._lastName = n; }
  },
  async startNew() {
    G.s = freshState(); G.mode = 'play'; Menu.hide(); $('#hud').classList.remove('hidden'); this.rotateTip();
    await Scenes.intro();
  },
  continueGame() {
    const s = Save.read(); if (!s) return this.startNew();
    G.s = s; G.mode = 'play'; Menu.hide(); this.rotateTip(); $('#hud').classList.remove('hidden');
    World.enter(s.loc && LOC[s.loc] && !s.loc.startsWith('__') ? s.loc : 'office1', s.px, s.py, s.dir);
    UI.toast('', 'Продолжаем: эпизод ' + s.episode);
  },
  // запуск эпизода: из меню — с наградами прошлых эпизодов; по сюжету — на том же месте
  async startEpisode(n, fromMenu) {
    if (n === 1 && fromMenu) return this.startNew();
    if (fromMenu) {
      G.s = freshState();
      for (let k = 1; k < n; k++) this.grant(k);
      G.s.maxEpisode = Math.max(n, Save.maxEpisode());
    }
    G.mode = 'play'; Menu.hide(); $('#hud').classList.remove('hidden');
    G.s.episode = n; G.s.maxEpisode = Math.max(G.s.maxEpisode, n); store.set('mrruben_maxep', String(Math.max(Save.maxEpisode(), n)));
    const E = EPISODES[n];
    Time.set('night', CH_CLOCK[n] || '21:40');
    G.cutscene = true;
    const cardP = UI.card('ЭПИЗОД ' + n, E.title.toUpperCase(), E.date + ' · ' + G.s.clock + '<br>' + E.short);
    if (!fromMenu) setTimeout(() => { const c = $('#card'); if (c.onclick && !c.classList.contains('hidden')) c.onclick(); }, 2400); // по сюжету заставка закрывается сама
    await cardP;
    G.cutscene = false;
    if (fromMenu || !World.locId || World.locId.startsWith('__')) World.enter('office1', 604, 1020, 'up');
    else { World._key = null; World.enter(World.locId, World.player.x, World.player.y, World.player.dir); }
    Save.write();
    if (Scenes['ep' + n]) Scenes['ep' + n]();
  },
  grant(k) {
    const g = EPISODES[k].grants; if (!g) return;
    for (const e of g.ev || []) if (!G.s.evidence.includes(e)) G.s.evidence.push(e);
    for (const f of g.flags || []) G.s.flags[f] = true;
    for (const s of g.sus || []) G.s.suspects[s] = { added: true };
    for (const e of g.ev || []) { const w = EVIDENCE[e].who; if (CHARS[w] && w !== 'varya') G.s.suspects[w] = { added: true }; }
    for (const i of g.items || []) if (!G.s.inv.includes(i) && !G.s.easter.includes(i)) (ITEMS[i].kind === 'easter' ? G.s.easter : G.s.inv).push(i);
    for (const c of g.comps || []) G.s.comps[c] = { unlocked: true };
    for (const p of g.puzzles || []) G.s.puzzles[p] = true;
    for (const q of g.seen || []) G.s.seen[q] = 1;
    G.s.links = G.s.links || []; for (const r of REL) if (r.ep === k && r.key && !G.s.links.includes(r.id)) G.s.links.push(r.id);
    G.s.flags.morning = true;
  },
  // глава завершается сама, когда собраны все нужные факты — без дня/ночи и поездок домой
  checkChapter() {
    const n = G.s.episode; if (n < 2 || n > 9 || G.advancing || G.mode !== 'play' || UI.blocking()) return;
    if (!EPISODES[n].done() || !Case.allDone(n) || !EPISODES[n].objectives.every(o => o.done())) return; // все цели, включая сообщения

    G.advancing = true;

      while (UI.blocking()) await wait(200);

    }, 1000);
  },
  checkNightThoughts() { },

/* ---------------- Цикл ---------------- */
let _last = performance.now();
function loop(now) {
  Input.paint && Input.paint();
  const raw = (now - _last) / 1000; _last = now; const dt = Math.min(0.1, raw); Dbg.frame(raw * 1000);
  try {
    if (G.mode === 'menu') Menu.draw(dt);
    else {
      // движение мелкими шагами: при низком fps герой идёт с нормальной скоростью и не проходит сквозь стены

function boot() {

  addEventListener('keydown', () => { SND.init(); if (G.mode === 'menu') SND.music('title'); }, { once: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden) Save.write(); });
  addEventListener('pagehide', () => Save.write());
  resize(); aptReady().then(() => Menu.show()); // комната должна быть готова до первого входа в неё
  requestAnimationFrame(loop);
}
